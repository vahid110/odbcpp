version: 2
updates:
  # Propose reviewed updates to immutable action pins; never auto-merge them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Dependabot commit metadata in PRs #232–234 names the dependencies
      # github/codeql-action/init, /upload-sarif and /analyze (subpaths included).
      codeql-action:
        patterns:
          - "github/codeql-action/*"
