name: record provider canary
on:
  workflow_call:
    inputs:
      provider:
        required: true
        type: string
      outcome:
        required: true
        type: string
      receipt:
        required: false
        type: string
    outputs:
      receipt:
        value: ${{ jobs.record.outputs.receipt }}
      attempt:
        value: ${{ jobs.record.outputs.attempt }}
    secrets:
      ODBCPP_REVIEWER_PRIVATE_KEY:
        required: true

permissions: {}
jobs:
  record:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == format('{0}/.github/workflows/agent-review-canary.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    outputs:
      receipt: ${{ steps.proof.outputs.receipt }}
      attempt: ${{ steps.proof.outputs.attempt }}
    environment: agent-review
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: reviewer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liLzexEhszs2AHlm
          private-key: ${{ secrets.ODBCPP_REVIEWER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - name: Record the tested configuration for this provider
        id: proof
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          RECEIPT: ${{ inputs.receipt }}
          PROVIDER: ${{ inputs.provider }}
          OUTCOME: ${{ inputs.outcome }}
        run: |
          [[ "$PROVIDER" == claude || "$PROVIDER" == openai ]]
          fingerprint=$(.github/review/fingerprint.sh)
          name="Provider canary $PROVIDER $fingerprint"
          anchor=$(cat .github/review/run-anchor)
          app=$(cat .github/review/reviewer-app-id)
          attempt="$GITHUB_RUN_NUMBER:$GITHUB_RUN_ATTEMPT"
          endpoint="repos/$GITHUB_REPOSITORY/check-runs"
          if [[ "$OUTCOME" == begin ]]; then
            gh api -X POST "$endpoint" -f head_sha="$anchor" -f name="$name" \
              -f external_id="$attempt" -f status=in_progress > check.json
            [[ "$(jq -r .app.id check.json)" == "$app" ]]
            echo "receipt=$(jq -r .id check.json)" >> "$GITHUB_OUTPUT"
            echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          else
            [[ "$RECEIPT" =~ ^[0-9]+$ ]]
            gh api "$endpoint/$RECEIPT" > check.json
            jq -e --arg name "$name" --arg anchor "$anchor" --arg attempt "$attempt" --arg app "$app" \
              '.name==$name and .head_sha==$anchor and .external_id==$attempt and (.app.id|tostring)==$app' check.json >/dev/null
            conclusion=failure
            if [[ "$OUTCOME" == success ]]; then conclusion=success; fi
            gh api -X PATCH "$endpoint/$RECEIPT" -f status=completed -f conclusion="$conclusion" --silent
          fi
