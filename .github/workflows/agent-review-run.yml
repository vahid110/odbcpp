name: agent review run

# One review by one role, called by agent-review.yml. It reviews the PR's
# head at the time the job starts, so a queued run never wastes itself on a
# commit that has moved on. The model gets no shell and no network tools:
# what it needs about the PR is written to review-context/ first, the
# workspace is cleaned by .github/review/prepare-workspace.sh, and reads are
# limited to the workspace (.github/review/claude-args.txt, proven by the
# canary). The verdict and the required check are posted by later steps as
# odbcpp-reviewer[bot]; the model never holds that key.

on:
  workflow_call:
    inputs:
      role:
        description: correctness or red-team
        required: true
        type: string

permissions: {}

jobs:
  review:
    name: agent review (${{ inputs.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Secrets come from this environment, which only main may use.
    environment: agent-review
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      ROLE: ${{ inputs.role }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Find the head to review
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Kept outside the workspace: checkout empties it.
          raw="$RUNNER_TEMP/pr-raw.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$raw"
          head=$(jq -r .head.sha "$raw")
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '.[]' | jq -s . > "$RUNNER_TEMP/reviews.json"
          # Skip if this role already reviewed this exact head (a duplicate
          # event); a withheld verdict does not count as a review.
          done=$(jq --arg h "$head" --arg role "[$ROLE reviewer]" '[.[]
                   | select(.user.login == "odbcpp-reviewer[bot]" and .commit_id == $h)
                   | select(.body | ltrimstr("**") | startswith($role))
                   | select(.body | split("\n")[0] | contains("verdict withheld") | not)] | length' \
                 "$RUNNER_TEMP/reviews.json")
          if [[ "$(jq -r .state "$raw")" != open || "$done" != 0 ]]; then
            echo "Nothing to review: PR state $(jq -r .state "$raw"), $done existing review(s) of ${head:0:7}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "HEAD_SHA=$head" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(jq -r .base.sha "$raw")" >> "$GITHUB_ENV"

      - name: Check out main
        if: steps.head.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the PR head for reading only
        if: steps.head.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: pr-head
          persist-credentials: false

      - name: Prepare the review context
        if: steps.head.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/review/prepare-workspace.sh
          mkdir review-context
          jq '{number, title, body, user: .user.login, labels: [.labels[].name],
               base: .base.ref, head_sha: .head.sha}' "$RUNNER_TEMP/pr-raw.json" > review-context/pr.json
          # The exact diff of the reviewed commit against its merge base.
          gh api -H "Accept: application/vnd.github.diff" \
            "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" > review-context/pr.diff
          gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '.check_runs[] | {name, status, conclusion}' > review-context/checks.jsonl
          # This role's own earlier reviews, so fixes can be checked; the
          # other role's reviews stay hidden (independent reviews).
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq ".[] | select(.user.login == \"odbcpp-reviewer[bot]\")
                      | select(.body | ltrimstr(\"**\") | startswith(\"[$ROLE reviewer]\"))
                      | {commit: .commit_id, state, body}" > review-context/previous-reviews.jsonl
          ls -l review-context

      - name: Load the reviewer's tool rules
        id: args
        if: steps.head.outputs.skip != 'true'
        shell: bash
        # Shared with agent-review-canary.yml, which proves these rules hold.
        run: echo "args=$(tr '\n' ' ' < .github/review/claude-args.txt)" >> "$GITHUB_OUTPUT"

      - name: Install bubblewrap and socat for subprocess isolation
        # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB needs it, and Claude Code refuses to
        # start without it. Before the run is recorded, so a failure here
        # does not use up the daily review budget. The smoke test fails here, clearly, if the runner
        # does not allow it (for example an AppArmor user-namespace rule).
        if: steps.head.outputs.skip != 'true'
        shell: bash
        run: |
          # As the pinned action installs them for its own isolated mode.
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $attempt failed, retrying..."
            sleep 5
          done
          command -v bwrap >/dev/null && command -v socat >/dev/null || { echo "::error::could not install bubblewrap and socat after 3 attempts"; exit 1; }
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor; bubblewrap needs them. The runner is discarded after the job.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Namespaces as in Claude Code's sandbox, not just a bind mount.
          bwrap --unshare-all --die-with-parent --ro-bind / / --dev /dev --proc /proc true
          echo "bubblewrap $(bwrap --version)"

      - name: Get the reviewer identity
        id: reviewer
        if: steps.head.outputs.skip != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liLzexEhszs2AHlm
          private-key: ${{ secrets.ODBCPP_REVIEWER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-checks: write

      - name: Record this review run
        # Before the model starts, so every run counts toward the daily review
        # budget, however it ends (review_gate.py over_budget). Recorded on
        # the fixed commit in .github/review/run-anchor, so a force-push does
        # not drop it from the count.
        if: steps.head.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
        run: |
          jq -n --arg sha "$(cat .github/review/run-anchor)" --arg name "agent review run ($ROLE) #$PR_NUMBER" \
            '{name: $name, head_sha: $sha, status: "completed", conclusion: "neutral",
              output: {title: "Review run started", summary: "Counts toward the daily review budget."}}' |
            gh api -X POST "repos/$REPO/check-runs" --input - --jq .app.id > recorded-app-id.txt
          # The budget counts only this App's runs; a mismatch would make it
          # count nothing, so stop here instead.
          expected=$(cat .github/review/reviewer-app-id)
          if [[ "$(cat recorded-app-id.txt)" != "$expected" ]]; then
            echo "::error::Review runs are recorded by App $(cat recorded-app-id.txt), not $expected (.github/review/reviewer-app-id)."
            exit 1
          fi

      - name: Review
        id: review
        if: steps.head.outputs.skip != 'true'
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Agents push as odbcpp-agent; labels come from odbcpp-reviewer.
          allowed_bots: odbcpp-agent,odbcpp-reviewer
          display_report: 'false'
          prompt: |
            Read .github/review/${{ inputs.role }}.md and follow it.
            Pull request #${{ github.event.pull_request.number }} of ${{ github.repository }},
            head commit ${{ env.HEAD_SHA }}.
          claude_args: >-
            ${{ steps.args.outputs.args }}
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","body","labels"],"properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"body":{"type":"string"},"labels":{"type":"array","items":{"type":"string","enum":["security","auth","protocol","transactions","process"]}}}}'

      - name: Post the verdict as odbcpp-reviewer[bot]
        if: steps.head.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo "PR moved from $HEAD_SHA to $current; a queued run reviews it."
            exit 0
          fi
          python3 -I - <<'EOF'
          import json, os, re
          result = json.loads(os.environ["RESULT"])
          text = json.dumps(result)
          # Never publish anything that looks like a credential.
          secret = re.compile(
              r"gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|sk-ant-|eyJ[A-Za-z0-9_-]{10,}\.|"
              r"-----BEGIN [A-Z ]*KEY|ACTIONS_RUNTIME_TOKEN|ACTIONS_ID_TOKEN|"
              r"CLAUDE_CODE_OAUTH_TOKEN\s*[=:]")
          suspicious = bool(secret.search(text))
          tag = f"[{os.environ['ROLE']} reviewer]"
          short = os.environ["HEAD_SHA"][:7]
          if suspicious:
              review = {"event": "REQUEST_CHANGES",
                        "body": f"{tag} verdict withheld at {short}\n\nThe review "
                                "output matched a credential pattern and was not published. "
                                f"See {os.environ['RUN_URL']}."}
          else:
              event = {"approve": "APPROVE", "request_changes": "REQUEST_CHANGES"}[result["verdict"]]
              review = {"event": event,
                        "body": f"{tag} {result['verdict'].replace('_', ' ')} at {short}\n\n{result['body']}"}
          review["commit_id"] = os.environ["HEAD_SHA"]
          json.dump(review, open("review.json", "w"))
          labels = result.get("labels", []) if os.environ["ROLE"] == "correctness" and not suspicious else []
          json.dump({"labels": labels}, open("labels-to-add.json", "w"))
          open("withheld", "w").write("1" if suspicious else "")
          EOF
          gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input review.json > /dev/null
          # The reviewer, not the author, adds high-risk labels; a new one
          # starts the red-team review.
          if [[ "$(jq '.labels | length' labels-to-add.json)" != 0 ]]; then
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/labels" --input labels-to-add.json > /dev/null
          fi
          if [[ -s withheld ]]; then
            echo "::error::Review output matched a credential pattern and was withheld."
            exit 1
          fi

      - name: Update the agent review check
        # Read, decide and post in one step, so the check reflects the
        # reviews as late as possible (both roles may post at about the
        # same time; a later event or a re-run settles any stale result).
        if: ${{ !cancelled() && steps.head.outputs.skip != 'true' && steps.reviewer.outputs.token != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
        run: |
          gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[].name]' > labels.json
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | jq -R . | jq -s . > files.json
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/events" --jq '.[]' | jq -s . > events.json
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '.[]' | jq -s . > reviews.json
          .github/review/list-runs.sh
          python3 -I -B .github/review/review_gate.py status
          .github/review/post-check.sh
