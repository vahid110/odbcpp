name: agent review run

# One review by one role, called by agent-review.yml. It reviews the PR's
# head at the time the job starts, so a queued run never wastes itself on a
# commit that has moved on. The model gets no shell and no network tools:
# what it needs about the PR is written to review-context/ first, the
# workspace is cleaned by .github/review/prepare-workspace.sh, and reads are
# limited to the workspace (.github/review/claude-args.txt, proven by the
# canary). Three jobs (#205): start records the run with a token that can
# only write check runs; model runs Claude Code and holds no reviewer token;
# post mints a fresh token after the model has finished, validates the output
# (review_gate.prepare_review) and posts the verdict and the required check
# as odbcpp-reviewer[bot].

on:
  workflow_call:
    inputs:
      role:
        description: correctness or red-team
        required: true
        type: string
    # The caller passes these by name only; the values come from the
    # agent-review environment of the job below, which takes precedence over
    # anything passed in. Required, so a caller that does not name them fails
    # instead of the job getting empty strings (#213).
    secrets:
      ODBCPP_REVIEWER_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  start:
    # Finds the head and records the run, so every run counts toward the daily
    # budget however it ends. Its reviewer token can only write check runs and
    # is gone before the model starts (#205).
    name: agent review start (${{ inputs.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Secrets come from this environment, which only main may use.
    environment: agent-review
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      ROLE: ${{ inputs.role }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    outputs:
      skip: ${{ steps.head.outputs.skip }}
      head_sha: ${{ steps.head.outputs.head_sha }}
      base_sha: ${{ steps.head.outputs.base_sha }}
    steps:
      - name: Find the head to review
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Kept outside the workspace: checkout empties it.
          raw="$RUNNER_TEMP/pr-raw.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$raw"
          head=$(jq -r .head.sha "$raw")
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '.[]' | jq -s . > "$RUNNER_TEMP/reviews.json"
          # Skip if this role already reviewed this exact head (a duplicate
          # event); a withheld verdict does not count as a review. GitHub
          # re-points commit_id to a new head after a force-push, so the
          # header must also name the full head SHA (review_gate.names_commit).
          done=$(jq --arg h "$head" --arg role "[$ROLE reviewer]" '[.[]
                   | select(.user.login == "odbcpp-reviewer[bot]" and .commit_id == $h)
                   | select(.body | ltrimstr("**") | startswith($role))
                   | select(.body | split("\n")[0] | test(" at " + $h + "($|[^0-9a-f])"))
                   | select(.body | split("\n")[0] | contains("verdict withheld") | not)] | length' \
                 "$RUNNER_TEMP/reviews.json")
          if [[ "$(jq -r .state "$raw")" != open || "$done" != 0 ]]; then
            echo "Nothing to review: PR state $(jq -r .state "$raw"), $done existing review(s) of ${head:0:7}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r .base.sha "$raw")" >> "$GITHUB_OUTPUT"

      - name: Check out the review configuration from main
        if: steps.head.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Get a reviewer token that can only record the run
        id: reviewer
        if: steps.head.outputs.skip != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liLzexEhszs2AHlm
          private-key: ${{ secrets.ODBCPP_REVIEWER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Record this review run
        # Before the model starts, so every run counts toward the daily review
        # budget, however it ends (review_gate.py over_budget). Recorded on
        # the fixed commit in .github/review/run-anchor, so a force-push does
        # not drop it from the count.
        if: steps.head.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
        run: |
          jq -n --arg sha "$(cat .github/review/run-anchor)" --arg name "agent review run ($ROLE) #$PR_NUMBER" \
            '{name: $name, head_sha: $sha, status: "completed", conclusion: "neutral",
              output: {title: "Review run started", summary: "Counts toward the daily review budget."}}' |
            gh api -X POST "repos/$REPO/check-runs" --input - --jq .app.id > recorded-app-id.txt
          # The budget counts only this App's runs; a mismatch would make it
          # count nothing, so stop here instead.
          expected=$(cat .github/review/reviewer-app-id)
          if [[ "$(cat recorded-app-id.txt)" != "$expected" ]]; then
            echo "::error::Review runs are recorded by App $(cat recorded-app-id.txt), not $expected (.github/review/reviewer-app-id)."
            exit 1
          fi


  model:
    # Runs the model. No step here mints or references the reviewer key, so no
    # reviewer token exists while the model runs (#205). The job still uses the
    # agent-review environment for the Claude token; keeping the reviewer key
    # out of the runner then relies on GitHub sending a job only the secrets
    # it references, until the key moves to an environment of its own (#222).
    # Its only result is the structured output, which the post job validates
    # before publishing anything.
    name: agent review (${{ inputs.role }})
    needs: start
    if: needs.start.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: agent-review
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      ROLE: ${{ inputs.role }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ needs.start.outputs.head_sha }}
      BASE_SHA: ${{ needs.start.outputs.base_sha }}
    outputs:
      result: ${{ steps.review.outputs.structured_output }}
    steps:
      - name: Save the pull request for the review context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-raw.json"

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the PR head for reading only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: pr-head
          persist-credentials: false

      - name: Prepare the review context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/review/prepare-workspace.sh
          mkdir review-context
          # head_sha is the commit the start job chose and the prompt names,
          # even if the pull request moved since (post then discards the result).
          jq --arg h "$HEAD_SHA" '{number, title, body, user: .user.login, labels: [.labels[].name],
               base: .base.ref, head_sha: $h}' "$RUNNER_TEMP/pr-raw.json" > review-context/pr.json
          # The exact diff of the reviewed commit against its merge base.
          gh api -H "Accept: application/vnd.github.diff" \
            "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" > review-context/pr.diff
          gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '.check_runs[] | {name, status, conclusion}' > review-context/checks.jsonl
          # This role's own earlier reviews, so fixes can be checked; the
          # other role's reviews stay hidden (independent reviews). The
          # reviewed commit comes from each header, not commit_id, which
          # GitHub re-points to the new head after a force-push (#210).
          # gh's --jq uses Go regular expressions: no lookahead.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq ".[] | select(.user.login == \"odbcpp-reviewer[bot]\")
                      | select(.body | ltrimstr(\"**\") | startswith(\"[$ROLE reviewer]\"))
                      | {reviewed_commit: ((.body | split(\"\\n\")[0] | capture(\" at (?<s>[0-9a-f]{40})($|[^0-9a-f])\") | .s) // \"unknown\"),
                         state, body}" > review-context/previous-reviews.jsonl
          ls -l review-context

      - name: Load the reviewer's tool rules
        id: args
        shell: bash
        # Shared with agent-review-canary.yml, which proves these rules hold.
        run: echo "args=$(tr '\n' ' ' < .github/review/claude-args.txt)" >> "$GITHUB_OUTPUT"

      - name: Install bubblewrap and socat for subprocess isolation
        # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB needs it, and Claude Code refuses to
        # start without it. The run is already recorded (start job), so a
        # failure here counts toward the daily budget, which fails closed. The
        # smoke test fails here, clearly, if the runner does not allow it (for
        # example an AppArmor user-namespace rule).
        shell: bash
        run: |
          # As the pinned action installs them for its own isolated mode.
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $attempt failed, retrying..."
            sleep 5
          done
          command -v bwrap >/dev/null && command -v socat >/dev/null || { echo "::error::could not install bubblewrap and socat after 3 attempts"; exit 1; }
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor; bubblewrap needs them. The runner is discarded after the job.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Namespaces as in Claude Code's sandbox, not just a bind mount.
          bwrap --unshare-all --die-with-parent --ro-bind / / --dev /dev --proc /proc true
          echo "bubblewrap $(bwrap --version)"

      - name: Install the pinned Claude Code binary
        id: claude
        # The action would otherwise run `curl https://claude.ai/install.sh |
        # bash` at run time, outside the reviewed configuration (#205). Fetch
        # the exact release named in .github/review/claude-code-release and
        # check its SHA-256 before anything runs it.
        shell: bash
        run: |
          read -r version sha256 < <(grep -v '^#' .github/review/claude-code-release)
          dest="$RUNNER_TEMP/claude-code/claude"
          mkdir -p "$(dirname "$dest")"
          curl -fsSL --retry 3 \
            "https://downloads.claude.ai/claude-code-releases/${version}/linux-x64/claude" -o "$dest"
          echo "${sha256}  ${dest}" | sha256sum -c -
          chmod +x "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          github_token: ${{ github.token }}
          # Agents push as odbcpp-agent; labels come from odbcpp-reviewer.
          allowed_bots: odbcpp-agent,odbcpp-reviewer
          display_report: 'false'
          prompt: |
            Read .github/review/${{ inputs.role }}.md and follow it.
            Pull request #${{ github.event.pull_request.number }} of ${{ github.repository }},
            head commit ${{ env.HEAD_SHA }}.
          claude_args: >-
            ${{ steps.args.outputs.args }}
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","body","labels"],"properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"body":{"type":"string"},"labels":{"type":"array","items":{"type":"string","enum":["security","auth","protocol","transactions","process"]}}}}'


  post:
    # Publishes the validated verdict and updates the required check with a
    # fresh reviewer token, minted only after the model has finished (#205).
    name: agent review post (${{ inputs.role }})
    needs: [start, model]
    if: ${{ !cancelled() && needs.start.outputs.skip != 'true' && needs.start.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: agent-review
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      ROLE: ${{ inputs.role }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ needs.start.outputs.head_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the review configuration from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Get the reviewer identity
        id: reviewer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liLzexEhszs2AHlm
          private-key: ${{ secrets.ODBCPP_REVIEWER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-checks: write

      - name: Post the verdict as odbcpp-reviewer[bot]
        if: needs.model.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          RESULT: ${{ needs.model.outputs.result }}
        run: |
          current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo "PR moved from $HEAD_SHA to $current; a queued run reviews it."
            exit 0
          fi
          # Validates the untrusted output and writes review.json,
          # labels-to-add.json and withheld (review_gate.prepare_review).
          python3 -I -B .github/review/review_gate.py prepare
          gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input review.json > /dev/null
          # The reviewer, not the author, adds high-risk labels; a new one
          # starts the red-team review.
          if [[ "$(jq '.labels | length' labels-to-add.json)" != 0 ]]; then
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/labels" --input labels-to-add.json > /dev/null
          fi
          if [[ -s withheld ]]; then
            echo "::error::The review output was withheld (malformed, or matched a credential pattern)."
            exit 1
          fi

      - name: Update the agent review check
        # Read, decide and post in one step, so the check reflects the
        # reviews as late as possible (both roles may post at about the
        # same time; a later event or a re-run settles any stale result).
        if: ${{ !cancelled() && steps.reviewer.outputs.token != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
        run: |
          gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[].name]' > labels.json
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | jq -R . | jq -s . > files.json
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/events" --jq '.[]' | jq -s . > events.json
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '.[]' | jq -s . > reviews.json
          .github/review/list-runs.sh
          python3 -I -B .github/review/review_gate.py status
          .github/review/post-check.sh
