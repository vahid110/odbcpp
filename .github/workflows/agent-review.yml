name: agent review

# Independent agent review of every pull request to main (ADR 0001,
# decision 4), and the required "agent review" check that is green only when
# every required reviewer approved the exact head commit.
#
# Runs on pull_request_target so the workflows, the review configuration in
# .github/review/ and the secrets always come from main. The secrets live in
# the agent-review environment, which only main may use, so no other branch
# can read them. Decisions are made in .github/review/review_gate.py (tested
# by test_review_gate.py). The plan job has no concurrency group and review
# jobs queue instead of cancelling; each review job reviews the PR's current
# head when it starts.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

jobs:
  plan:
    # Same-repository, non-draft PRs to main only: forks never reach the
    # secrets, and only main's configuration ever runs with them.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: agent-review
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      correctness: ${{ steps.plan.outputs.correctness }}
      red_team: ${{ steps.plan.outputs.red_team }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_ACTION: ${{ github.event.action }}
      ADDED_LABEL: ${{ github.event.label.name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ENABLED_FOR: ${{ vars.AGENT_REVIEW_ENABLED }}
    steps:
      - name: Check out the review configuration from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /AGENTS.md
            /docs/adr/0001-development-process.md

      - name: Check that the canary proved this configuration
        id: gate
        shell: bash
        run: |
          fingerprint=$(.github/review/fingerprint.sh)
          if [[ "$ENABLED_FOR" == "$fingerprint" ]]; then
            echo "state=enabled" >> "$GITHUB_OUTPUT"
          elif [[ -z "$ENABLED_FOR" ]]; then
            echo "::notice::Agent review is not enabled; run the agent review canary."
            echo "state=off" >> "$GITHUB_OUTPUT"
          else
            # Enabled once, but the configuration changed since the canary
            # passed: fail the required check until the canary passes again.
            echo "::error::Agent review configuration changed (fingerprint $fingerprint); run the agent review canary."
            echo "state=stale" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the PR's labels, files, label history and reviews
        if: steps.gate.outputs.state == 'enabled'
        shell: bash
        run: |
          gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[].name]' > labels.json
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | jq -R . | jq -s . > files.json
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/events" --jq '.[]' | jq -s . > events.json
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '.[]' | jq -s . > reviews.json
          .github/review/list-runs.sh

      - name: Decide which reviews run
        id: plan
        if: steps.gate.outputs.state == 'enabled'
        shell: bash
        run: python3 -I -B .github/review/review_gate.py plan >> "$GITHUB_OUTPUT"

      - name: Get the reviewer identity
        id: reviewer
        if: steps.gate.outputs.state != 'off'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liLzexEhszs2AHlm
          private-key: ${{ secrets.ODBCPP_REVIEWER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-checks: write

      - name: Add the high-risk labels the reviewer requires
        if: steps.plan.outputs.add_labels != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          ADD_LABELS: ${{ steps.plan.outputs.add_labels }}
        run: |
          jq -cn --arg l "$ADD_LABELS" '{labels: ($l | split(","))}' |
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/labels" --input - > /dev/null

      - name: Set the agent review check for this head
        if: steps.gate.outputs.state != 'off'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          STATE: ${{ steps.gate.outputs.state }}
        run: |
          if [[ "$STATE" == stale ]]; then
            .github/review/post-check.sh failure "Agent review configuration changed; the owner must re-run the canary."
          else
            # Path rules and every high-risk label ever added count, so the
            # labels added above are already part of this decision.
            python3 -I -B .github/review/review_gate.py status
            .github/review/post-check.sh
          fi

  correctness:
    needs: plan
    if: needs.plan.outputs.correctness == 'true'
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}-correctness
      # Queue, never cancel: an older run must not cancel a newer review.
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/agent-review-run.yml
    # The caller names the secrets; the values come from the agent-review
    # environment of the called job, which GitHub gives precedence (this job
    # has no environment, so here they are empty). Unnamed, they would be
    # empty strings there too (#213). Do not add repository secrets for them.
    secrets:
      ODBCPP_REVIEWER_PRIVATE_KEY: ${{ secrets.ODBCPP_REVIEWER_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_REVIEW_API_KEY: ${{ secrets.OPENAI_REVIEW_API_KEY }}
    with:
      role: correctness

  red-team:
    needs: plan
    if: needs.plan.outputs.red_team == 'true'
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}-red-team
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/agent-review-run.yml
    # The caller names the secrets; the values come from the agent-review
    # environment of the called job, which GitHub gives precedence (this job
    # has no environment, so here they are empty). Unnamed, they would be
    # empty strings there too (#213). Do not add repository secrets for them.
    secrets:
      ODBCPP_REVIEWER_PRIVATE_KEY: ${{ secrets.ODBCPP_REVIEWER_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_REVIEW_API_KEY: ${{ secrets.OPENAI_REVIEW_API_KEY }}
    with:
      role: red-team

  report-failure:
    # A notice on the PR when a review fails; posted with the workflow token,
    # since the reviewer identity only posts reviews, labels and the check.
    needs: [correctness, red-team]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CORRECTNESS: ${{ needs.correctness.result }}
          RED_TEAM: ${{ needs.red-team.result }}
        run: |
          roles=""
          [[ "$CORRECTNESS" == failure ]] && roles="correctness"
          [[ "$RED_TEAM" == failure ]] && roles="${roles:+$roles, }red-team"
          roles=${roles:-plan}
          jq -n --arg b "Agent review failed for: $roles. Event at ${HEAD_SHA:0:7}; the current head may have no verdict. Re-run the failed job from $RUN_URL." \
            '{body: $b}' | gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input - > /dev/null
