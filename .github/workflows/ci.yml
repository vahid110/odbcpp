name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      ODBCSYSINI: ${{ github.workspace }}/.ci-odbc
      ODBCINI: ${{ github.workspace }}/.ci-odbc/odbc.ini

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev unixodbc-dev

      - name: Configure test DSN
        run: |
          mkdir -p "$ODBCSYSINI"
          cat > "$ODBCINI" <<'EOF'
          [RedshiftProd]
          Driver=ODBCPP PostgreSQL
          Server=127.0.0.1
          Port=5432
          Database=postgres
          UID=postgres
          PWD=postgres
          SSL=0
          TransportMode=Sync
          DeadlineModel=Strict
          EOF
          cat > "$ODBCSYSINI/odbcinst.ini" <<'EOF'
          [ODBCPP PostgreSQL]
          Driver=${{ github.workspace }}/build/libodbcpp.so
          Setup=${{ github.workspace }}/build/libodbcpp.so
          DriverUnicodeType=UTF16
          TransportMode=Auto
          AsyncMaxInflight=64
          AsyncQueueDepth=256
          AsyncEngine=Auto
          DeadlineModel=Strict
          LogLevel=Info
          LogSink=File
          LogFile=${{ github.workspace }}/build/ci-driver.log
          LogFormat=Json
          LogQueries=false
          EOF

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTING=ON
          -DTARGET_DATABASE=POSTGRESQL
          -DOPENSSL_USE_STATIC_LIBS=OFF
          -DODBC_DRIVER_MANAGER_FLAVOR=UNIXODBC
          -DODBCPP_EXPECT_DRIVER_SQLWCHAR_SIZE=2
          -DODBCPP_EXPECT_DM_SQLWCHAR_SIZE=2
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -- -j

      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure

      - name: Run integration tests
        run: ctest --test-dir build -L integration --output-on-failure

      - name: Run integration tests with Linux epoll transport
        run: |
          sed -i '/^TransportMode=Sync$/c\TransportMode=Async\nAsyncEngine=Epoll' "$ODBCINI"
          ctest --test-dir build -L integration --output-on-failure

      - name: Run integration tests with Auto-selected transport
        run: |
          sed -i 's/^TransportMode=Async$/TransportMode=Auto/' "$ODBCINI"
          sed -i 's/^AsyncEngine=Epoll$/AsyncEngine=Auto/' "$ODBCINI"
          ctest --test-dir build -L integration --output-on-failure

      - name: Verify production logging
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/ci-driver.log")
          records = [json.loads(line) for line in path.read_text().splitlines()]
          assert any(record.get("record", {}).get("event") == "query_completed"
                     for record in records)
          assert all("sql" not in record.get("record", {}) for record in records)
          assert all("PWD=" not in line for line in path.read_text().splitlines())
          PY

  windows-unit:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verify runner OpenSSL
        shell: pwsh
        run: openssl version

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-windows -A x64
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTING=ON
          -DTARGET_DATABASE=POSTGRESQL
          -DOPENSSL_USE_STATIC_LIBS=OFF
          -DODBCPP_EXPECT_DRIVER_SQLWCHAR_SIZE=2
          -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL"

      - name: Build
        shell: pwsh
        run: cmake --build build-windows --config Release --parallel

      - name: Run unit tests
        shell: pwsh
        run: >-
          ctest --test-dir build-windows -C Release -L unit
          --timeout 30 --output-on-failure

  linux-sanitizers:
    runs-on: ubuntu-latest

    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev unixodbc-dev

      - name: Configure
        run: >-
          cmake -S . -B build-sanitize
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTING=ON
          -DTARGET_DATABASE=POSTGRESQL
          -DOPENSSL_USE_STATIC_LIBS=OFF
          -DODBC_DRIVER_MANAGER_FLAVOR=UNIXODBC
          -DODBCPP_EXPECT_DRIVER_SQLWCHAR_SIZE=2
          -DODBCPP_EXPECT_DM_SQLWCHAR_SIZE=2
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Run unit tests
        run: >-
          ctest --test-dir build-sanitize -L unit
          --timeout 60 --output-on-failure

  iodbc-unicode:
    runs-on: macos-latest

    env:
      ODBCINI: ${{ github.workspace }}/.ci-iodbc/odbc.ini
      ODBCINSTINI: ${{ github.workspace }}/.ci-iodbc/odbcinst.ini

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: brew install libiodbc unixodbc postgresql@17

      - name: Start disposable PostgreSQL
        run: |
          pg_bin="$(brew --prefix postgresql@17)/bin"
          pg_data="$RUNNER_TEMP/odbcpp-postgres"
          "$pg_bin/initdb" -D "$pg_data" -U postgres -A trust \
            --no-locale --encoding=UTF8
          "$pg_bin/pg_ctl" -D "$pg_data" \
            -l "$RUNNER_TEMP/odbcpp-postgres.log" \
            -o '-p 5432 -h 127.0.0.1' -w start
          echo "ODBCPP_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
          echo "ODBCPP_PG_DATA=$pg_data" >> "$GITHUB_ENV"

      - name: Configure iODBC test DSN
        run: |
          mkdir -p "$(dirname "$ODBCINI")"
          cat > "$ODBCINI" <<'EOF'
          [RedshiftProd]
          Driver=ODBCPP PostgreSQL
          Server=127.0.0.1
          Port=5432
          Database=postgres
          UID=postgres
          PWD=postgres
          SSL=0
          TransportMode=Sync
          DeadlineModel=Strict
          EOF
          cat > "$ODBCINSTINI" <<'EOF'
          [ODBCPP PostgreSQL]
          Driver=${{ github.workspace }}/build-iodbc/libodbcpp.dylib
          Setup=${{ github.workspace }}/build-iodbc/libodbcpp.dylib
          DriverUnicodeType=UTF16
          TransportMode=Auto
          AsyncMaxInflight=64
          AsyncQueueDepth=256
          AsyncEngine=Auto
          DeadlineModel=Strict
          EOF

      - name: Configure mixed-width driver-manager test
        run: |
          cmake -S . -B build-iodbc \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=ON \
            -DTARGET_DATABASE=POSTGRESQL \
            -DOPENSSL_USE_STATIC_LIBS=OFF \
            -DODBC_INCLUDE_DIR="$(brew --prefix unixodbc)/include" \
            -DODBC_DRIVER_MANAGER_FLAVOR=IODBC \
            -DODBC_DRIVER_MANAGER_INCLUDE_DIR="$(brew --prefix libiodbc)/include" \
            -DODBC_DRIVER_MANAGER_LIBRARY="$(brew --prefix libiodbc)/lib/libiodbc.dylib" \
            -DODBCPP_EXPECT_DRIVER_SQLWCHAR_SIZE=2 \
            -DODBCPP_EXPECT_DM_SQLWCHAR_SIZE=4 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-iodbc --parallel

      - name: Run unit tests
        run: ctest --test-dir build-iodbc -L unit --output-on-failure

      - name: Run iODBC mixed-width integration test
        run: >-
          ctest --test-dir build-iodbc -R '^it_driver_manager$'
          --output-on-failure

      - name: Stop PostgreSQL
        if: always()
        run: |
          if [[ -n "${ODBCPP_PG_DATA:-}" && -d "$ODBCPP_PG_DATA" ]]; then
            "$ODBCPP_PG_BIN/pg_ctl" -D "$ODBCPP_PG_DATA" -m fast -w stop
          fi
