name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The protocol layer currently supports PostgreSQL MD5 authentication.
        # Move back to a current image when SCRAM-SHA-256 support lands.
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: md5
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      ODBCSYSINI: ${{ github.workspace }}/.ci-odbc
      ODBCINI: ${{ github.workspace }}/.ci-odbc/odbc.ini

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev unixodbc-dev

      - name: Configure test DSN
        run: |
          mkdir -p "$ODBCSYSINI"
          cat > "$ODBCINI" <<'EOF'
          [RedshiftProd]
          Driver=ODBCPP Redshift
          Server=127.0.0.1
          Port=5432
          Database=postgres
          UID=postgres
          PWD=postgres
          SSL=0
          TransportMode=Sync
          DeadlineModel=Strict
          EOF
          cat > "$ODBCSYSINI/odbcinst.ini" <<'EOF'
          [ODBCPP Redshift]
          TransportMode=Auto
          AsyncMaxInflight=64
          AsyncQueueDepth=256
          AsyncEngine=Auto
          DeadlineModel=Strict
          EOF

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTING=ON
          -DOPENSSL_USE_STATIC_LIBS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -- -j

      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure

      - name: Run integration tests
        run: ctest --test-dir build -L integration --output-on-failure

      - name: Run integration tests with Linux epoll transport
        run: |
          sed -i '/^TransportMode=Sync$/c\TransportMode=Async\nAsyncEngine=Epoll' "$ODBCINI"
          ctest --test-dir build -L integration --output-on-failure

      - name: Run integration tests with Auto-selected transport
        run: |
          sed -i 's/^TransportMode=Async$/TransportMode=Auto/' "$ODBCINI"
          sed -i 's/^AsyncEngine=Epoll$/AsyncEngine=Auto/' "$ODBCINI"
          ctest --test-dir build -L integration --output-on-failure

  windows-unit:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verify runner OpenSSL
        shell: pwsh
        run: openssl version

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-windows -A x64
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTING=ON
          -DOPENSSL_USE_STATIC_LIBS=OFF
          -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL"

      - name: Build
        shell: pwsh
        run: cmake --build build-windows --config Release --parallel

      - name: Run unit tests
        shell: pwsh
        run: >-
          ctest --test-dir build-windows -C Release -L unit
          --timeout 30 --output-on-failure
