name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_linked_server:
        description: Run the heavy SQL Server linked-server acceptance job
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      ODBCSYSINI: ${{ github.workspace }}/.ci-odbc
      ODBCINI: ${{ github.workspace }}/.ci-odbc/odbc.ini

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev unixodbc-dev

      - name: Configure test DSN
        run: |
          mkdir -p "$ODBCSYSINI"
          cat > "$ODBCINI" <<'EOF'
          [RedshiftProd]
          Driver=ODBCPP PostgreSQL
          Server=127.0.0.1
          Port=5432
          Database=postgres
          UID=postgres
          PWD=postgres
          SSL=0
          TransportMode=Sync
          DeadlineModel=Strict
          EOF
          cat > "$ODBCSYSINI/odbcinst.ini" <<'EOF'
          [ODBCPP PostgreSQL]
          Driver=${{ github.workspace }}/build/libodbcpp.so
          Setup=${{ github.workspace }}/build/libodbcpp.so
          DriverUnicodeType=UTF16
          TransportMode=Auto
          AsyncMaxInflight=64
          AsyncQueueDepth=256
          AsyncEngine=Auto
          DeadlineModel=Strict
          LogLevel=Info
          LogSink=File
          LogFile=${{ github.workspace }}/build/ci-driver.log
          LogFormat=Json
          LogQueries=false
          EOF

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_EXAMPLES=ON
          -DBUILD_TESTING=ON
          -DTARGET_DATABASE=POSTGRESQL
          -DODBCPP_CRYPTO_PROVIDER=OPENSSL
          -DODBCPP_CRYPTO_LINKAGE=SYSTEM_SHARED
          -DODBCPP_CRYPTO_TLS_PROOF=ON
          -DODBC_DRIVER_MANAGER_FLAVOR=UNIXODBC
          -DODBCPP_EXPECT_DRIVER_SQLWCHAR_SIZE=2
          -DODBCPP_EXPECT_DM_SQLWCHAR_SIZE=2
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -- -j

      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure --output-junit openssl-system-shared-unit.xml

      - name: Prove pinned MySQL verified TLS authentication
        run: >-
          python3 tests/security/test_mysql_auth_live.py
          --probe build/tests/mysql_auth_probe
          --output build/mysql-auth-live.json

      - name: Preserve MySQL authentication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-auth-live
          path: build/mysql-auth-live.json
          if-no-files-found: ignore

      - name: Bind system-shared unit qualification evidence
        run: |
          python3 tools/ci/test_crypto_qualification.py
          python3 tools/ci/record-crypto-qualification.py --build build \
          --driver build/libodbcpp.so --probe build/tests/crypto_identity_probe \
          --unit-report build/openssl-system-shared-unit.xml --platform Linux \
          --output build/odbcpp-crypto-unit-qualification.json

      - name: Run integration tests
        run: ctest --test-dir build -L integration -E '^it_crypto_profile_live$' --output-on-failure

      - name: Run integration tests with Linux epoll transport
        run: |
          sed -i '/^TransportMode=Sync$/c\TransportMode=Async\nAsyncEngine=Epoll' "$ODBCINI"
          ctest --test-dir build -L integration -E '^it_crypto_profile_live$' --output-on-failure

      - name: Run integration tests with Auto-selected transport
        run: |
          sed -i 's/^TransportMode=Async$/TransportMode=Auto/' "$ODBCINI"
          sed -i 's/^AsyncEngine=Epoll$/AsyncEngine=Auto/' "$ODBCINI"
          ctest --test-dir build -L integration -E '^it_crypto_profile_live$' --output-on-failure

      - name: Prepare mandatory TLS qualification fixture
        run: |
          tls="$RUNNER_TEMP/postgres-system-shared-tls"
          bash tools/ci/prepare-postgres-tls.sh "${{ job.services.postgres.id }}" "$tls"
          echo '127.0.0.1 wrong-host.invalid' | sudo tee -a /etc/hosts
          echo "ODBCPP_POSTGRES_TLS_DIR=$tls" >> "$GITHUB_ENV"

      - name: Run mandatory system-shared TLS and SCRAM profile tests
        run: tools/ci/run-crypto-profile-live.sh build openssl-system-shared-live.xml

      - name: Bind system-shared live qualification evidence
        run: |
          python3 tools/ci/record-crypto-qualification.py --build build \
          --driver build/libodbcpp.so --probe build/tests/crypto_identity_probe \
          --unit-report build/openssl-system-shared-unit.xml --platform Linux \
          --live-report openssl-system-shared-live.xml \
          --output build/odbcpp-crypto-live-qualification.json

      - name: Verify production logging
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/ci-driver.log")
          records = [json.loads(line) for line in path.read_text().splitlines()]
          assert any(record.get("record", {}).get("event") == "query_completed"
                     for record in records)
          assert all("sql" not in record.get("record", {}) for record in records)
          assert all("PWD=" not in line for line in path.read_text().splitlines())
          PY

      - name: Retain system-shared TLS qualification inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openssl-system-shared-tls-proof
          path: |
            build/openssl-system-shared-unit.xml
            openssl-system-shared-live.xml
            build/tests/crypto_tls_probe
            build/tests/crypto_identity_probe
            build/odbcpp-crypto-identity-evidence.json
            build/odbcpp-crypto-unit-qualification.json
            build/odbcpp-crypto-live-qualification.json
            build/libodbcpp.so
            build/odbcpp-crypto-manifest.json
            build/odbcpp-crypto-artifact-evidence.json
          if-no-files-found: error

  redshift-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify offline Redshift pilot admission safeguards
        run: python3 -m unittest discover -s tools/redshift -p 'test_pilot_preflight.py'
      - name: Install deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev unixodbc-dev
      - name: Configure Redshift target
        run: >-
          cmake -S . -B build-redshift
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTING=ON
          -DTARGET_DATABASE=REDSHIFT
          -DODBCPP_CRYPTO_PROVIDER=OPENSSL
          -DODBCPP_CRYPTO_LINKAGE=SYSTEM_SHARED
          -DODBC_DRIVER_MANAGER_FLAVOR=UNIXODBC
          -DODBCPP_EXPECT_DRIVER_SQLWCHAR_SIZE=2
          -DODBCPP_EXPECT_DM_SQLWCHAR_SIZE=2
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-redshift --parallel
      - name: Run Redshift unit tests
        run: ctest --test-dir build-redshift -L unit --output-on-failure
      - name: Verify real Redshift pilot rejects absent endpoint
        run: |
          if ctest --test-dir build-redshift -R '^it_redshift_real$' \
              --output-on-failure > "$RUNNER_TEMP/redshift-missing-endpoint.log" 2>&1; then
            cat "$RUNNER_TEMP/redshift-missing-endpoint.log"
            echo "Real Redshift pilot unexpectedly passed without an endpoint" >&2
            exit 1
          fi
          grep -q 'ODBCPP_REDSHIFT_TEST_CONNECTION is required' \
            "$RUNNER_TEMP/redshift-missing-endpoint.log"

  windows-live:
    runs-on: windows-2025

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      ODBCINI: ${{ github.workspace }}/.ci-odbc/odbc.ini
      ODBCINSTINI: ${{ github.workspace }}/.ci-odbc/odbcinst.ini
      ODBCSYSINI: ${{ github.workspace }}/.ci-odbc

    steps:
      - uses: actions/checkout@v5

      - name: Verify runner OpenSSL
        shell: pwsh
        run: openssl version

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-windows -A x64
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTING=ON
          -DTARGET_DATABASE=POSTGRESQL
          -DODBCPP_CRYPTO_PROVIDER=OPENSSL
          -DODBCPP_CRYPTO_LINKAGE=BUNDLED_SHARED
          -DODBCPP_CRYPTO_PROFILE_LIVE_TESTS=ON
          -DODBCPP_CRYPTO_TLS_PROOF=ON
          -DODBCPP_EXPECT_DRIVER_SQLWCHAR_SIZE=2
          -DODBCPP_EXPECT_DM_SQLWCHAR_SIZE=2
          -DODBCPP_CRYPTO_ROOT="C:/Program Files/OpenSSL"

      - name: Build
        shell: pwsh
        run: cmake --build build-windows --config Release --parallel

      - name: Run unit tests
        shell: pwsh
        run: >-
          ctest --test-dir build-windows -C Release -L unit
          --timeout 30 --output-on-failure --output-junit windows-openssl-unit.xml

      - name: Bind Windows unit qualification evidence
        shell: pwsh
        run: >-
          python tools/ci/record-crypto-qualification.py --build build-windows
          --driver build-windows/Release/odbcpp.dll
          --probe build-windows/tests/Release/crypto_identity_probe.exe
          --unit-report build-windows/windows-openssl-unit.xml --platform Windows
          --output build-windows/odbcpp-crypto-unit-qualification.json


      - name: Start PostgreSQL and register Windows ODBC driver
        shell: pwsh
        run: ./tools/ci/windows-postgres.ps1 -Action Start -EnableTls

      - name: Run live PostgreSQL and Windows Driver Manager tests
        shell: pwsh
        run: |
          $env:GTEST_OUTPUT = "xml:$env:RUNNER_TEMP/odbcpp-integration-results/"
          ctest --test-dir build-windows -C Release -L integration -E '^it_crypto_profile_live$' --timeout 90 --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Windows integration tests failed" }
          $reports = @(Get-ChildItem "$env:RUNNER_TEMP/odbcpp-integration-results" -Filter *.xml)
          $expectedReports = @(
            Get-ChildItem tests/integration -Filter *.cpp |
              Where-Object Name -ne 'it_redshift_real.cpp'
          ).Count
          if ($reports.Count -ne $expectedReports) {
            throw "Expected $expectedReports PostgreSQL GoogleTest integration reports, found $($reports.Count)"
          }
          foreach ($report in $reports) {
            [xml]$result = Get-Content $report.FullName
            if ([int]$result.testsuites.tests -eq 0 -or [int]$result.testsuites.skipped -ne 0) {
              throw "Empty or skipped integration cases in $($report.Name)"
            }
          }

      - name: Verify registry-only System DSN under a service identity
        shell: pwsh
        run: ./tools/ci/windows-system-dsn.ps1

      - name: Run mandatory Windows TLS and SCRAM profile tests
        shell: pwsh
        run: ./tools/ci/windows-crypto-profile-live.ps1

      - name: Build x64 beta MSI and upgrade fixtures
        shell: pwsh
        run: |
          ./packaging/windows/test-inputs.ps1
          ./packaging/windows/build.ps1 -Version 1.0.0
          ./packaging/windows/build.ps1 -Version 1.0.1
          ./packaging/windows/build.ps1 -Version 1.0.2 -FailureFixture
          New-Item build-windows/package-acceptance -ItemType Directory | Out-Null
          Copy-Item build-windows/package/*.msi build-windows/package-acceptance
          Copy-Item build-windows/tests/Release/it_driver_manager.exe,build-windows/tests/Release/it_setup.exe,build-windows/tests/Release/it_package_load.exe build-windows/package-acceptance

      - name: Preserve beta installer
        uses: actions/upload-artifact@v4
        with:
          name: odbcpp-postgresql-beta-x64
          path: |
            build-windows/package/odbcpp-postgresql-1.0.0-x64.msi
            build-windows/package/odbcpp-postgresql-1.0.0-x64.msi.sha256
            build-windows/package/payload-1.0.0/inventory.json
            windows-crypto-profile-live.xml
            build-windows/windows-openssl-unit.xml
            build-windows/odbcpp-crypto-unit-qualification.json
            build-windows/tests/Release/crypto_identity_probe.exe
            build-windows/tests/Release/crypto_tls_probe.exe
            build-windows/odbcpp-crypto-identity-evidence.json
            build-windows/package/payload-1.0.0/odbcpp-crypto-manifest.json
            build-windows/package/payload-1.0.0/odbcpp-crypto-artifact-evidence.json
            packaging/windows/README.md
          if-no-files-found: error

      - name: Pass packages to fresh-runner acceptance
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-acceptance-inputs
          path: build-windows/package-acceptance
          if-no-files-found: error

      - name: Stop PostgreSQL
        if: always()
        shell: pwsh
        run: ./tools/ci/windows-postgres.ps1 -Action Stop

      - name: Preserve Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-live-test-evidence
          path: |
            build-windows/Testing/Temporary/LastTest.log
            build-windows/windows-openssl-unit.xml
            build-windows/odbcpp-crypto-unit-qualification.json
            build-windows/tests/Release/crypto_tls_probe.exe
            build-windows/tests/Release/crypto_identity_probe.exe
            build-windows/odbcpp-crypto-manifest.json
            build-windows/odbcpp-crypto-identity-evidence.json
            ${{ runner.temp }}/odbcpp-integration-results
            ${{ runner.temp }}/odbcpp-postgres.log
            ${{ runner.temp }}/odbcpp-system-dsn.log
            ${{ runner.temp }}/odbcpp-setup-*.bmp
          retention-days: 7

  windows-package:
    timeout-minutes: 15
    needs: windows-live
    runs-on: windows-2025
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-package-acceptance-inputs
          path: package-artifacts
      - name: Validate fresh-runner package lifecycle
        shell: pwsh
        run: ./tools/ci/windows-package.ps1
      - name: Preserve package acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-evidence
          path: |
            ${{ runner.temp }}/package-logs
            ${{ runner.temp }}/odbcpp-administrator-*.png
            ${{ runner.temp }}/odbcpp-setup-*.bmp
            ${{ runner.temp }}/odbcpp-postgres.log

  windows-linked-server:
    if: github.event_name == 'workflow_dispatch' && inputs.run_linked_server
    timeout-minutes: 45
    needs: windows-live
    runs-on: windows-2025
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: odbcpp-postgresql-beta-x64
          path: beta-artifact
      - name: Validate SQL Server linked server and OPENQUERY
        shell: pwsh
        run: ./tools/ci/windows-linked-server.ps1
      - name: Preserve linked-server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-linked-server-evidence
          path: |
            ${{ runner.temp }}/linked-server-evidence
            ${{ runner.temp }}/odbcpp-postgres.log
          retention-days: 7

  linux-sanitizers:
    runs-on: ubuntu-latest

    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev unixodbc-dev

      - name: Configure
        run: >-
          cmake -S . -B build-sanitize
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTING=ON
          -DTARGET_DATABASE=POSTGRESQL
          -DODBCPP_CRYPTO_PROVIDER=OPENSSL
          -DODBCPP_CRYPTO_LINKAGE=SYSTEM_SHARED
          -DODBC_DRIVER_MANAGER_FLAVOR=UNIXODBC
          -DODBCPP_EXPECT_DRIVER_SQLWCHAR_SIZE=2
          -DODBCPP_EXPECT_DM_SQLWCHAR_SIZE=2
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Run unit tests
        run: >-
          ctest --test-dir build-sanitize -L unit
          --timeout 60 --output-on-failure

  linux-openssl-static:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      ODBCSYSINI: ${{ github.workspace }}/.ci-openssl-static
      ODBCINI: ${{ github.workspace }}/.ci-openssl-static/odbc.ini

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev unixodbc-dev

      - name: Configure PostgreSQL verified-TLS fixture
        run: |
          tls="$RUNNER_TEMP/postgres-tls"
          bash tools/ci/prepare-postgres-tls.sh "${{ job.services.postgres.id }}" "$tls"
          echo '127.0.0.1 wrong-host.invalid' | sudo tee -a /etc/hosts
          echo "ODBCPP_POSTGRES_TLS_DIR=$tls" >> "$GITHUB_ENV"

      - name: Configure static-profile ODBC registration
        run: |
          mkdir -p "$ODBCSYSINI"
          cat > "$ODBCINI" <<'EOF'
          [RedshiftProd]
          Driver=ODBCPP PostgreSQL
          Server=127.0.0.1
          Port=5432
          Database=postgres
          UID=postgres
          PWD=postgres
          SSL=0
          TransportMode=Sync
          DeadlineModel=Strict
          EOF
          cat > "$ODBCSYSINI/odbcinst.ini" <<'EOF'
          [ODBCPP PostgreSQL]
          Driver=${{ github.workspace }}/build-openssl-static/libodbcpp.so
          Setup=${{ github.workspace }}/build-openssl-static/libodbcpp.so
          DriverUnicodeType=UTF16
          EOF

      - name: Prepare controlled static OpenSSL prefix
        run: |
          root="$RUNNER_TEMP/openssl-static"
          mkdir -p "$root/include" "$root/lib"
          cp -aL /usr/include/openssl "$root/include/"
          multiarch="$(gcc -print-multiarch)"
          if [[ -d "/usr/include/$multiarch/openssl" ]]; then
            cp -aL "/usr/include/$multiarch/openssl/." "$root/include/openssl/"
          fi
          ssl_archive="/usr/lib/$multiarch/libssl.a"
          crypto_archive="/usr/lib/$multiarch/libcrypto.a"
          shared_ssl="$(realpath -e "/usr/lib/$multiarch/libssl.so.3")"
          shared_crypto="$(realpath -e "/usr/lib/$multiarch/libcrypto.so.3")"
          test -f "$ssl_archive"
          test -f "$crypto_archive"
          test -f "$shared_ssl"
          test -f "$shared_crypto"
          test "$(dirname "$(realpath -e "$ssl_archive")")" = \
            "$(dirname "$(realpath -e "$crypto_archive")")"
          package_files="$RUNNER_TEMP/libssl-dev-files"
          dpkg-query -L libssl-dev > "$package_files"
          grep -Fx "$ssl_archive" "$package_files"
          grep -Fx "$crypto_archive" "$package_files"
          package_version="$(dpkg-query -W -f='${Version}' libssl-dev)"
          ssl_runtime_package="$(dpkg-query -S "$shared_ssl" | cut -d: -f1)"
          crypto_runtime_package="$(dpkg-query -S "$shared_crypto" | cut -d: -f1)"
          test "$ssl_runtime_package" = "$crypto_runtime_package"
          runtime_package_version="$(dpkg-query -W -f='${Version}' "$ssl_runtime_package")"
          test "$runtime_package_version" = "$package_version"
          cp -L "$ssl_archive" "$crypto_archive" "$root/lib/"
          test -z "$(find "$root" -type l -print -quit)"
          python3 - "$package_version" "$ssl_runtime_package" \
            "$runtime_package_version" "$multiarch" "$shared_ssl" \
            "$shared_crypto" "$ssl_archive" "$crypto_archive" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          (package_version, runtime_package, runtime_package_version, multiarch,
           shared_ssl, shared_crypto, *archives) = sys.argv[1:]
          evidence = {
              "package": "libssl-dev",
              "packageVersion": package_version,
              "runtimePackage": runtime_package,
              "runtimePackageVersion": runtime_package_version,
              "multiarch": multiarch,
              "cohabitationLibraries": {
                  Path(path).name: {
                      "path": str(Path(path).resolve(strict=True)),
                      "sha256": hashlib.sha256(Path(path).read_bytes()).hexdigest(),
                  }
                  for path in (shared_ssl, shared_crypto)
              },
              "sourceArchives": {
                  Path(path).name: {
                      "path": str(Path(path).resolve(strict=True)),
                      "sha256": hashlib.sha256(Path(path).read_bytes()).hexdigest(),
                  }
                  for path in archives
              },
          }
          Path("openssl-static-source-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY
          echo "ODBCPP_STATIC_OPENSSL_ROOT=$root" >> "$GITHUB_ENV"
          echo "ODBCPP_COHABITATION_SSL_LIBRARY=$shared_ssl" >> "$GITHUB_ENV"
          echo "ODBCPP_COHABITATION_CRYPTO_LIBRARY=$shared_crypto" >> "$GITHUB_ENV"

      - name: Configure controlled static profile
        run: >-
          cmake -S . -B build-openssl-static
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTING=ON
          -DTARGET_DATABASE=POSTGRESQL
          -DODBCPP_CRYPTO_PROVIDER=OPENSSL
          -DODBCPP_CRYPTO_LINKAGE=BUNDLED_STATIC
          -DODBCPP_CRYPTO_TLS_PROOF=ON
          -DODBCPP_CRYPTO_ROOT="$ODBCPP_STATIC_OPENSSL_ROOT"
          -DODBCPP_CRYPTO_COHABITATION_SSL_LIBRARY="$ODBCPP_COHABITATION_SSL_LIBRARY"
          -DODBCPP_CRYPTO_COHABITATION_CRYPTO_LIBRARY="$ODBCPP_COHABITATION_CRYPTO_LIBRARY"
          -DODBC_DRIVER_MANAGER_FLAVOR=UNIXODBC
          -DODBCPP_EXPECT_DRIVER_SQLWCHAR_SIZE=2
          -DODBCPP_EXPECT_DM_SQLWCHAR_SIZE=2
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and run common crypto tests
        run: |
          cmake --build build-openssl-static --parallel
          ctest --test-dir build-openssl-static -L unit \
            -E '^test_static_crypto_cohabitation$' \
            --timeout 60 --output-on-failure --output-junit openssl-static-unit.xml
          LD_PRELOAD="$ODBCPP_COHABITATION_CRYPTO_LIBRARY:$ODBCPP_COHABITATION_SSL_LIBRARY" \
            build-openssl-static/tests/test_static_crypto_cohabitation \
              --gtest_output=xml:openssl-static-cohabitation.xml

      - name: Run mandatory live TLS, SCRAM, and cohabitation tests
        run: |
          trusted="DRIVER={ODBCPP PostgreSQL};SERVER=127.0.0.1;PORT=5432;DATABASE=postgres;UID=postgres;PWD=postgres;SSL=1;SSLCAFILE=$ODBCPP_POSTGRES_TLS_DIR/server.crt;"
          wrong_ca="DRIVER={ODBCPP PostgreSQL};SERVER=127.0.0.1;PORT=5432;DATABASE=postgres;UID=postgres;PWD=postgres;SSL=1;SSLCAFILE=$ODBCPP_POSTGRES_TLS_DIR/wrong.crt;"
          wrong_host="DRIVER={ODBCPP PostgreSQL};SERVER=wrong-host.invalid;PORT=5432;DATABASE=postgres;UID=postgres;PWD=postgres;SSL=1;SSLCAFILE=$ODBCPP_POSTGRES_TLS_DIR/server.crt;"
          LD_PRELOAD="$ODBCPP_COHABITATION_CRYPTO_LIBRARY:$ODBCPP_COHABITATION_SSL_LIBRARY" \
            ctest --test-dir build-openssl-static -L integration \
              -E '^it_crypto_profile_live$' \
              --timeout 60 --output-on-failure
          ODBCPP_CRYPTO_PROFILE_TEST_CONNECTION="$trusted" \
          ODBCPP_CRYPTO_PROFILE_WRONG_CA_CONNECTION="$wrong_ca" \
          ODBCPP_CRYPTO_PROFILE_WRONG_HOST_CONNECTION="$wrong_host" \
          LD_PRELOAD="$ODBCPP_COHABITATION_CRYPTO_LIBRARY:$ODBCPP_COHABITATION_SSL_LIBRARY" \
            build-openssl-static/tests/it_crypto_profile_live \
              --gtest_output=xml:openssl-static-live.xml
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
              "openssl-static-cohabitation.xml": {
                  "StaticCryptoCohabitationTest.PreservesPreloadedProviderAndLoadsOnlyOdbcSurface"
              },
              "openssl-static-live.xml": {
                  "CryptoProfileLiveTest.CompletesVerifiedTlsScramQuery",
                  "CryptoProfileLiveTest.RejectsUntrustedCertificate",
                  "CryptoProfileLiveTest.RejectsHostnameMismatch",
              },
          }
          for path, expected_cases in expected.items():
              root = ET.parse(path).getroot()
              cases = {
                  f'{case.attrib["classname"]}.{case.attrib["name"]}'
                  for case in root.iter("testcase")
              }
              assert cases == expected_cases, (path, cases)
              assert not list(root.iter("failure")), path
              assert not list(root.iter("error")), path
              assert not list(root.iter("skipped")), path
          driver = Path("build-openssl-static/libodbcpp.so")
          shared_ssl = Path(os.environ["ODBCPP_COHABITATION_SSL_LIBRARY"])
          shared_crypto = Path(os.environ["ODBCPP_COHABITATION_CRYPTO_LIBRARY"])
          evidence = {
              "schemaVersion": 1,
              "profile": "OPENSSL/BUNDLED_STATIC/Linux",
              "driverSha256": hashlib.sha256(driver.read_bytes()).hexdigest(),
              "preloadedLibraries": {
                  shared.name: {
                      "path": str(shared.resolve(strict=True)),
                      "sha256": hashlib.sha256(shared.read_bytes()).hexdigest(),
                  }
                  for shared in (shared_ssl, shared_crypto)
              },
              "verifiedTlsScramQuery": True,
              "untrustedCertificateRejected": True,
              "hostnameMismatchRejected": True,
              "sameProviderCohabitationVerified": True,
              "crossImplementationCohabitationVerified": False,
              "qualificationClaimed": False,
          }
          Path("openssl-static-live-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Verify bounded static evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import shutil
          root = Path("build-openssl-static")
          manifest = json.loads((root / "odbcpp-crypto-manifest.json").read_text())
          evidence = json.loads((root / "odbcpp-crypto-artifact-evidence.json").read_text())
          source = json.loads(Path("openssl-static-source-evidence.json").read_text())
          assert manifest["provider"] == "OPENSSL"
          assert manifest["requestedLinkage"] == "BUNDLED_STATIC"
          assert manifest["dependencyRoot"] == str(Path(__import__('os').environ["ODBCPP_STATIC_OPENSSL_ROOT"]))
          assert evidence["observedDependencyForm"] == "static"
          assert evidence["dependencyFormVerified"] is True
          assert evidence["configuredLinkInputsVerified"] is True
          assert evidence["dependencyOriginVerified"] is False
          assert evidence["qualificationClaimed"] is False
          assert evidence["staticLinkMapVerified"] is True
          assert evidence["staticArchiveMemberEvidenceVerified"] is True
          assert evidence["staticLinkerIdentity"].startswith("GNU ld ")
          assert evidence["staticLinkMapSha256"]
          assert evidence["runtimeDependencies"] == []
          assert evidence["sslLinkInputSha256"] == \
            source["sourceArchives"]["libssl.a"]["sha256"]
          assert evidence["cryptoLinkInputSha256"] == \
            source["sourceArchives"]["libcrypto.a"]["sha256"]
          retained_driver = Path("openssl-static-driver.so")
          shutil.copyfile(root / "libodbcpp.so", retained_driver)
          assert hashlib.sha256(retained_driver.read_bytes()).hexdigest() == \
            evidence["artifactSha256"]
          PY
          nm -D --undefined-only --format=posix \
            build-openssl-static/libodbcpp.so | awk '$2 == "U" {print $1}' | \
            sed 's/@.*$//' | \
            sort -u > "$RUNNER_TEMP/driver-undefined-symbols"
          nm -g --defined-only --format=posix \
            "$ODBCPP_STATIC_OPENSSL_ROOT/lib/libssl.a" \
            "$ODBCPP_STATIC_OPENSSL_ROOT/lib/libcrypto.a" | \
            awk '$2 ~ /^[A-Z]$/ {print $1}' | sort -u \
            > "$RUNNER_TEMP/provider-defined-symbols"
          comm -12 "$RUNNER_TEMP/driver-undefined-symbols" \
            "$RUNNER_TEMP/provider-defined-symbols" \
            > "$RUNNER_TEMP/unresolved-provider-symbols"
          test ! -s "$RUNNER_TEMP/unresolved-provider-symbols"

      - name: Prove relocated static runtime archive and dependency licenses
        run: |
          python3 tools/ci/test_openssl_static_package.py
          python3 tools/ci/prove-openssl-static-package.py \
            --build build-openssl-static \
            --openssl-license /usr/share/doc/libssl-dev/copyright \
            --output openssl-static-package-proof

      - name: Bind static-profile unit qualification evidence
        run: >-
          python3 tools/ci/record-crypto-qualification.py --build build-openssl-static
          --driver build-openssl-static/libodbcpp.so
          --probe build-openssl-static/tests/crypto_identity_probe
          --unit-report build-openssl-static/openssl-static-unit.xml --platform Linux
          --output build-openssl-static/odbcpp-crypto-unit-qualification.json

      - name: Preserve static-profile evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-openssl-static-evidence
          path: |
            build-openssl-static/tests/crypto_tls_probe
            build-openssl-static/tests/crypto_identity_probe
            build-openssl-static/odbcpp-crypto-identity-evidence.json
            build-openssl-static/odbcpp-crypto-unit-qualification.json
            build-openssl-static/openssl-static-unit.xml
            build-openssl-static/odbcpp-crypto-manifest.json
            build-openssl-static/odbcpp-crypto-artifact-evidence.json
            build-openssl-static/odbcpp-crypto-static-link.map
            openssl-static-driver.so
            openssl-static-source-evidence.json
            openssl-static-live-evidence.json
            openssl-static-cohabitation.xml
            openssl-static-live.xml
            openssl-static-package-proof/driver-only.tar.gz
            openssl-static-package-proof/package-evidence.json
            openssl-static-package-proof/extracted-driver-live.xml
            openssl-static-package-proof/extracted/odbcpp-openssl-static-proof/package-manifest.json
          if-no-files-found: error

  awslc-adapter-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ODBCPP_AWSLC_PG_PORT: 5432
      ODBCPP_AWSLC_PG_USER: postgres
      ODBCPP_AWSLC_PG_PASSWORD: postgres
    strategy:
      fail-fast: false
      matrix:
        shared: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v5
      - name: Install ODBC development dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev libssl-dev
      - name: Configure PostgreSQL verified-TLS fixture
        run: |
          tls="$RUNNER_TEMP/awslc-postgres-tls"
          bash tools/ci/prepare-postgres-tls.sh "${{ job.services.postgres.id }}" "$tls"
          echo "ODBCPP_AWSLC_PG_CA=$tls/server.crt" >> "$GITHUB_ENV"
          echo "ODBCPP_AWSLC_PG_WRONG_CA=$tls/wrong.crt" >> "$GITHUB_ENV"
      - name: Configure pinned non-FIPS adapter proof
        run: >-
          cmake -S tests/security/awslc -B build-awslc-proof
          -DCMAKE_BUILD_TYPE=Release
          -DODBCPP_AWSLC_LIVE_TESTS=ON
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build adapter and common tests
        run: >-
          cmake --build build-awslc-proof --parallel 4
          --target test_crypto_primitives test_scram_sha256 test_tls_client tls_probe test_postgres_live test_async_tls_transport test_provider_coexistence test_odbc_driver_live
      - name: Run mandatory common adapter tests
        run: >-
          ctest --test-dir build-awslc-proof --output-on-failure
          --timeout 90 --no-tests=error --output-junit adapter-results.xml
      - name: Preserve bounded proof evidence
        uses: actions/upload-artifact@v4
        with:
          name: awslc-adapter-shared-${{ matrix.shared }}
          path: |
            build-awslc-proof/adapter-results.xml
            build-awslc-proof/adapter-proof.json
            build-awslc-proof/linkage-manifest.json
            build-awslc-proof/postgres-artifact-evidence.json
            build-awslc-proof/postgres-link.map
            build-awslc-proof/test_postgres_live
            build-awslc-proof/test_provider_coexistence
            build-awslc-proof/preload-host.json
            build-awslc-proof/libawslc_odbc_driver.so
            build-awslc-proof/driver-artifact-evidence.json
            build-awslc-proof/driver-link.map
            build-awslc-proof/awslc-driver-proof.tar.gz
            build-awslc-proof/relocation-evidence.json
            build-awslc-proof/provider-identity-evidence.json
            build-awslc-proof/tls_probe
            build-awslc-proof/_deps/awslc-build/ssl/libssl*
            build-awslc-proof/_deps/awslc-build/crypto/libcrypto*
          if-no-files-found: error

  iodbc-unicode:
    runs-on: macos-latest

    strategy:
      matrix:
        include:
          - driver_headers: unixodbc
            driver_wchar_size: 2
            driver_unicode_type: UTF16
          - driver_headers: libiodbc
            driver_wchar_size: 4
            driver_unicode_type: UCS4

    env:
      ODBCINI: ${{ github.workspace }}/.ci-iodbc/odbc.ini
      ODBCINSTINI: ${{ github.workspace }}/.ci-iodbc/odbcinst.ini

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: brew install libiodbc unixodbc postgresql@17 python@3.12

      - name: Start disposable PostgreSQL
        run: |
          pg_bin="$(brew --prefix postgresql@17)/bin"
          pg_data="$RUNNER_TEMP/odbcpp-postgres"
          pwfile="$RUNNER_TEMP/postgres-init-password"
          (umask 077; printf '%s\n' postgres > "$pwfile")
          "$pg_bin/initdb" -D "$pg_data" -U postgres -A scram-sha-256 \
            --pwfile="$pwfile" --no-locale --encoding=UTF8
          rm "$pwfile"
          tls="$RUNNER_TEMP/postgres-macos-tls"
          bash tools/ci/prepare-native-postgres-tls.sh "$pg_data" "$tls"
          echo "ODBCPP_POSTGRES_TLS_DIR=$tls" >> "$GITHUB_ENV"
          echo "ODBCPP_CRYPTO_PROFILE_WRONG_HOST=localhost" >> "$GITHUB_ENV"
          "$pg_bin/pg_ctl" -D "$pg_data" \
            -l "$RUNNER_TEMP/odbcpp-postgres.log" \
            -o '-p 5432 -h 127.0.0.1' -w start
          echo "ODBCPP_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
          echo "ODBCPP_PG_DATA=$pg_data" >> "$GITHUB_ENV"

      - name: Configure iODBC test DSN
        run: |
          mkdir -p "$(dirname "$ODBCINI")"
          cat > "$ODBCINI" <<'EOF'
          [RedshiftProd]
          Driver=ODBCPP PostgreSQL
          Server=127.0.0.1
          Port=5432
          Database=postgres
          UID=postgres
          PWD=postgres
          SSL=0
          TransportMode=Sync
          DeadlineModel=Strict
          EOF
          cat > "$ODBCINSTINI" <<'EOF'
          [ODBCPP PostgreSQL]
          Driver=${{ github.workspace }}/build-iodbc/libodbcpp.dylib
          Setup=${{ github.workspace }}/build-iodbc/libodbcpp.dylib
          DriverUnicodeType=${{ matrix.driver_unicode_type }}
          TransportMode=Auto
          AsyncMaxInflight=64
          AsyncQueueDepth=256
          AsyncEngine=Auto
          DeadlineModel=Strict
          EOF

      - name: Configure iODBC driver-manager test
        run: |
          cmake -S . -B build-iodbc \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=ON \
            -DTARGET_DATABASE=POSTGRESQL \
            -DODBCPP_CRYPTO_PROVIDER=OPENSSL \
            -DODBCPP_CRYPTO_LINKAGE=SYSTEM_SHARED \
            -DODBCPP_CRYPTO_TLS_PROOF=ON \
            -DPython3_EXECUTABLE="$(brew --prefix python@3.12)/bin/python3.12" \
            -DODBC_INCLUDE_DIR="$(brew --prefix ${{ matrix.driver_headers }})/include" \
            -DODBC_DRIVER_MANAGER_FLAVOR=IODBC \
            -DODBC_DRIVER_MANAGER_INCLUDE_DIR="$(brew --prefix libiodbc)/include" \
            -DODBC_DRIVER_MANAGER_LIBRARY="$(brew --prefix libiodbc)/lib/libiodbc.dylib" \
            -DODBCPP_EXPECT_DRIVER_SQLWCHAR_SIZE=${{ matrix.driver_wchar_size }} \
            -DODBCPP_EXPECT_DM_SQLWCHAR_SIZE=4 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-iodbc --parallel

      - name: Run unit tests
        run: ctest --test-dir build-iodbc -L unit --output-on-failure --output-junit macos-openssl-unit.xml

      - name: Bind macOS unit qualification evidence
        run: >-
          "$(brew --prefix python@3.12)/bin/python3.12" tools/ci/record-crypto-qualification.py
          --build build-iodbc --driver build-iodbc/libodbcpp.dylib
          --probe build-iodbc/tests/crypto_identity_probe
          --unit-report build-iodbc/macos-openssl-unit.xml --platform Darwin
          --output build-iodbc/odbcpp-crypto-unit-qualification.json

      - name: Run PostgreSQL integration tests
        run: ctest --test-dir build-iodbc -L integration -E '^it_crypto_profile_live$' --output-on-failure

      - name: Run mandatory macOS TLS and SCRAM profile tests
        run: tools/ci/run-crypto-profile-live.sh build-iodbc macos-openssl-live.xml

      - name: Retain macOS TLS qualification inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-openssl-${{ matrix.driver_unicode_type }}-tls-proof
          path: |
            build-iodbc/macos-openssl-unit.xml
            macos-openssl-live.xml
            build-iodbc/tests/crypto_tls_probe
            build-iodbc/tests/crypto_identity_probe
            build-iodbc/odbcpp-crypto-identity-evidence.json
            build-iodbc/odbcpp-crypto-unit-qualification.json
            build-iodbc/libodbcpp.dylib
            build-iodbc/odbcpp-crypto-manifest.json
            build-iodbc/odbcpp-crypto-artifact-evidence.json
          if-no-files-found: error

      - name: Stop PostgreSQL
        if: always()
        run: |
          if [[ -n "${ODBCPP_PG_DATA:-}" && -d "$ODBCPP_PG_DATA" ]]; then
            "$ODBCPP_PG_BIN/pg_ctl" -D "$ODBCPP_PG_DATA" -m fast -w stop
          fi
