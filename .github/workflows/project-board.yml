name: Update project board

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  update:
    if: >-
      github.repository == 'vahid110/odbcpp' &&
      github.ref == 'refs/heads/main' &&
      (github.actor_id == '350232297' || github.actor_id == '5770674') &&
      (github.triggering_actor == 'odbcpp-agent[bot]' || github.triggering_actor == 'vahid110') &&
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/project ')
    # Only admitted commands enter the queue, not ordinary/untrusted comments.
    concurrency:
      group: project-board
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: project-board
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Validate request without the project credential
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 -B tools/ci/update_project_board.py validate
      - name: Apply the validated request
        env:
          GH_READ_TOKEN: ${{ github.token }}
          PROJECT_BOARD_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
        # Revalidates current issue/comment and triggering actor before any mutation.
        run: python3 -B tools/ci/update_project_board.py apply
