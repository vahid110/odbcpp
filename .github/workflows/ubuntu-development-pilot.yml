name: Focused Ubuntu qualification and experiments (NOT full acceptance)

on:
  workflow_call:
    inputs:
      expected_head:
        required: true
        type: string
      mode:
        type: string
        default: same_head
      seed_head:
        type: string
        default: ""
      changed_head:
        type: string
        default: ""
      submitted_at:
        required: true
        type: string
      product_head:
        type: string
        default: ""
      product_base:
        type: string
        default: ""
      product_targets:
        type: string
        default: test_diagnostics_apis
      product_cache:
        type: string
        default: "{}"
      conflicting_experiment:
        type: boolean
        default: false

# Candidate code may restore caches but cannot write, even through direct API calls.
# Only the workflow-source cold job and literal reviewed seed below can produce.
cache-mode: read

permissions:
  contents: read

# The manual ci.yml caller holds one global noncancelling Ubuntu heavy group.
# No secrets inheritance, endpoints, services, native tests or binary artifacts.
env:
  PILOT_EXPECTED_HEAD: ${{ inputs.expected_head }}
  PILOT_SUBMITTED_AT: ${{ inputs.submitted_at }}
  CCACHE_MAXSIZE: 256M
  CCACHE_COMPRESS: "true"
  CCACHE_COMPILERCHECK: content
  LC_ALL: C

jobs:
  product:
    cache-mode: read
    if: inputs.mode == 'product_qualification'
    name: Owning Linux product qualification - NOT full acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: product
    env:
      PILOT_MODE: product
      PILOT_EXPECTED_HEAD: ${{ inputs.product_head }}
      PILOT_WORKFLOW_HEAD: ${{ inputs.expected_head }}
      PILOT_WORKFLOW_ROOT: ${{ github.workspace }}/pilot-workflow
      PILOT_PRODUCT_BASE: ${{ inputs.product_base }}
      PILOT_PRODUCT_TARGETS: ${{ inputs.product_targets }}
      PILOT_PRODUCT_CACHE: ${{ inputs.product_cache }}
      PILOT_EXPERIMENT_REQUESTED: ${{ inputs.conflicting_experiment }}
    steps:
      - name: Require the read-only cache grant before candidate execution
        working-directory: ${{ github.workspace }}
        run: test "$ACTIONS_CACHE_MODE" = read
      - name: Check out reviewed immutable workflow/helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: pilot-workflow
          persist-credentials: false
      - name: Check out exact reviewed product and batch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.product_head }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Select fresh bounded compiler-object cache directory
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ubuntu-product-compiler-cache" >> "$GITHUB_ENV"
      - name: Verify separate immutable sources and allowlisted owning selection
        id: identity
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" init
      - name: Check helper offline
        run: python3 -m unittest discover -s "$PILOT_WORKFLOW_ROOT/tools/ci" -p test_ubuntu_development_pilot.py -v
      - name: Cheap changed-C++ GoogleTest control check BEFORE expensive commands
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" product-preflight
      - name: Install existing Redshift Linux dependencies
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" dependencies
      - name: Require an independently fresh graph and initially empty cache
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" empty-cache
      - name: Configure existing Release Redshift unixODBC2 profile
        id: configure
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" configure
      - name: Validate exact owning producer and actual compatibility before restore
        id: cache
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" product-cache-check
      - name: Record restore start
        if: steps.cache.outputs.restore == 'true'
        run: date -u +%Y-%m-%dT%H:%M:%S.%NZ > ubuntu-pilot-evidence/restore-start.txt
      - name: Restore ONLY selected compatible compiler objects
        id: restore
        if: steps.cache.outputs.restore == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache.outputs.restore_key }}
          enableCrossOsArchive: false
      - name: Retain actual restore hit/key/overhead
        if: always() && steps.cache.outputs.restore == 'true' && steps.restore.outcome != 'skipped'
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          date -u +%Y-%m-%dT%H:%M:%S.%NZ > ubuntu-pilot-evidence/restore-end.txt
          printf '%s\n' "$CACHE_HIT" > ubuntu-pilot-evidence/restore-hit.txt
          printf '%s\n' "$RESTORED_KEY" > ubuntu-pilot-evidence/restore-key.txt
      - name: Verify restored embedded producer before compiling any product
        env:
          PILOT_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          PILOT_RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" product-restore-check
      - name: Compile actual owning targets and SDK header units j2; freshly link
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" build
      - name: Record actual owning inventories, binaries, objects and staged headers
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" inventory
      - name: Execute selected owning GoogleTests and six architecture checks
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" test
      - name: Guard both sources after commands including failed phases
        if: always() && steps.identity.outcome == 'success'
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" product-source-guard
      - name: Preserve phase failures and source guards; eligible cache producer only after complete tests
        id: finish
        if: always() && steps.configure.outcome == 'success'
        env:
          PILOT_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          PILOT_RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" finish
      - name: Bound text evidence even after an original failure
        id: package
        if: always()
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" package
      - name: Retain small source-only owning qualification evidence
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-product-${{ inputs.product_head }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: product/ubuntu-pilot-evidence/
          retention-days: 3
          compression-level: 9
          if-no-files-found: error

  cold:
    # This producer executes the dispatch workflow source itself (github.sha).
    cache-mode: write
    if: inputs.mode == 'same_head'
    name: Experimental Linux cold - NOT full acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      cache_key: ${{ steps.configure.outputs.cache_key }}
      profile_digest: ${{ steps.configure.outputs.profile_digest }}
      inventory_digest: ${{ steps.inventory.outputs.inventory_digest }}
    env:
      PILOT_MODE: cold
    steps:
      - name: Check out exact selected workflow HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; official commit pinned
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select owned compiler-cache directory
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ubuntu-pilot-compiler-cache" >> "$GITHUB_ENV"
      - name: Verify reviewed selected-ref source and runner identity
        run: python3 tools/ci/ubuntu_development_pilot.py init
      - name: Verify pilot helper offline
        run: python3 -m unittest discover -s tools/ci -p test_ubuntu_development_pilot.py -v
      - name: Install existing Linux Redshift dependencies and compiler cache
        run: python3 tools/ci/ubuntu_development_pilot.py dependencies
      - name: Cold starts with NO restored compiler objects
        run: |
          test ! -d "$CCACHE_DIR"
          mkdir -p "$CCACHE_DIR"
      - name: Configure fresh Release Redshift unixODBC SQLWCHAR2 profile
        id: configure
        run: python3 tools/ci/ubuntu_development_pilot.py configure
      - name: Rebuild focused real targets and SDK first-only-include units (j2)
        run: python3 tools/ci/ubuntu_development_pilot.py build
      - name: Inventory actual ten CTests and all owning GoogleTest cases
        id: inventory
        run: python3 tools/ci/ubuntu_development_pilot.py inventory
      - name: Run four actual GoogleTest suites and six existing architecture checks
        run: python3 tools/ci/ubuntu_development_pilot.py test
      - name: Record statistics, original phase exits and source-only evidence index
        if: always() && steps.configure.outcome == 'success'
        env:
          PILOT_CACHE_HIT: "not-restored-cold"
        run: python3 tools/ci/ubuntu_development_pilot.py finish
      - name: Save ONLY bounded compiler objects for this run/attempt/source/profile
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.configure.outputs.cache_key }}
      - name: Bound source-only artifact even after a genuine phase failure
        id: package
        if: always()
        run: python3 tools/ci/ubuntu_development_pilot.py package
      - name: Retain small source-only evidence (no final binaries/build graph)
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-pilot-cold-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ubuntu-pilot-evidence/
          retention-days: 3
          compression-level: 9
          if-no-files-found: error

  warm:
    if: inputs.mode == 'same_head'
    name: Experimental Linux warm - NOT full acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: cold
    env:
      PILOT_MODE: warm
    steps:
      - name: Check out exact selected workflow HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; official commit pinned
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select owned compiler-cache directory
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ubuntu-pilot-compiler-cache" >> "$GITHUB_ENV"
      - name: Verify reviewed selected-ref source and runner identity
        run: python3 tools/ci/ubuntu_development_pilot.py init
      - name: Verify pilot helper offline
        run: python3 -m unittest discover -s tools/ci -p test_ubuntu_development_pilot.py -v
      - name: Install existing Linux Redshift dependencies and compiler cache
        run: python3 tools/ci/ubuntu_development_pilot.py dependencies
      - name: Configure fresh Release Redshift unixODBC SQLWCHAR2 profile
        id: configure
        run: python3 tools/ci/ubuntu_development_pilot.py configure
      - name: Require independently observed identical dependency/profile key
        env:
          COLD_KEY: ${{ needs.cold.outputs.cache_key }}
          WARM_KEY: ${{ steps.configure.outputs.cache_key }}
        run: test "$COLD_KEY" = "$WARM_KEY"
      - name: Record compiler-cache restore start
        run: date -u +%Y-%m-%dT%H:%M:%S.%NZ > ubuntu-pilot-evidence/restore-start.txt
      - name: Restore ONLY exact paired cold compiler objects
        id: restore
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ needs.cold.outputs.cache_key }}
          enableCrossOsArchive: false
      - name: Record actual restore outcome and end
        if: always() && steps.restore.outcome != 'skipped'
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          date -u +%Y-%m-%dT%H:%M:%S.%NZ > ubuntu-pilot-evidence/restore-end.txt
          printf '%s\n' "$CACHE_HIT" > ubuntu-pilot-evidence/restore-hit.txt
          printf '%s\n' "$RESTORED_KEY" > ubuntu-pilot-evidence/restore-key.txt
      - name: Rebuild focused real targets and SDK first-only-include units (j2)
        run: python3 tools/ci/ubuntu_development_pilot.py build
      - name: Inventory actual ten CTests and all owning GoogleTest cases
        id: inventory
        run: python3 tools/ci/ubuntu_development_pilot.py inventory
      - name: Require identical independently observed cold/warm test inventory
        env:
          COLD_INVENTORY: ${{ needs.cold.outputs.inventory_digest }}
          WARM_INVENTORY: ${{ steps.inventory.outputs.inventory_digest }}
        run: test "$COLD_INVENTORY" = "$WARM_INVENTORY"
      - name: Run four actual GoogleTest suites and six existing architecture checks
        run: python3 tools/ci/ubuntu_development_pilot.py test
      - name: Record statistics, original phase exits and source-only evidence index
        if: always() && steps.configure.outcome == 'success'
        env:
          PILOT_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: python3 tools/ci/ubuntu_development_pilot.py finish
      - name: Bound source-only artifact even after a genuine phase failure
        id: package
        if: always()
        run: python3 tools/ci/ubuntu_development_pilot.py package
      - name: Retain small source-only evidence (no final binaries/build graph)
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-pilot-warm-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ubuntu-pilot-evidence/
          retention-days: 3
          compression-level: 9
          if-no-files-found: error

  seed-a:
    # Immutable reviewed seed is selected literally before any product execution.
    cache-mode: write
    name: Experimental real-change seed A - NOT full acceptance
    if: inputs.mode == 'real_change'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: &real_defaults
      run:
        working-directory: product
    outputs: &real_outputs
      binary_digest: ${{ steps.inventory.outputs.binary_digest }}
      cache_key: ${{ steps.configure.outputs.cache_key }}
      compatibility_digest: ${{ steps.configure.outputs.compatibility_digest }}
      inventory_json: ${{ steps.inventory.outputs.inventory_json }}
      inventory_digest: ${{ steps.inventory.outputs.inventory_digest }}
    env:
      PILOT_MODE: seed-a
      PILOT_EXPECTED_HEAD: cac4e780dcc9ce84fcc8a3d104ab1afbf4ba0547
      PILOT_WORKFLOW_HEAD: ${{ inputs.expected_head }}
      PILOT_WORKFLOW_ROOT: ${{ github.workspace }}/pilot-workflow
      PILOT_SEED_HEAD: ${{ inputs.seed_head }}
      PILOT_CHANGED_HEAD: ${{ inputs.changed_head }}
      PILOT_SEED_CACHE_KEY: ""
      PILOT_SEED_COMPATIBILITY: ""
      PILOT_SEED_INVENTORY: ""
      PILOT_COLD_BINARY_DIGEST: ""
      PILOT_COLD_INVENTORY_DIGEST: ""
    steps: &real_steps
      - name: Check out reviewed immutable workflow/helper separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: pilot-workflow
          persist-credentials: false
      - name: Check out immutable product at identical source path
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.PILOT_EXPECTED_HEAD }}
          path: product
          persist-credentials: false
      - name: Select fresh owned compiler-cache path
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ubuntu-real-change-compiler-cache" >> "$GITHUB_ENV"
      - name: Bind separate reviewed product and workflow sources
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" init
      - name: Check helper offline (no substitute product assertions)
        run: python3 -m unittest discover -s "$PILOT_WORKFLOW_ROOT/tools/ci" -p test_ubuntu_development_pilot.py -v
      - name: Install existing Redshift dependencies
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" dependencies
      - name: Every independent graph starts with an empty compiler cache
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" empty-cache
      - name: Configure fresh identical Redshift Release graph
        id: configure
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" configure
      - name: Require selected A key and strict source-independent compatibility
        if: env.PILOT_MODE != 'seed-a'
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" cache-check
      - name: Record exact A cache restore start
        if: env.PILOT_MODE == 'cached-b'
        run: date -u +%Y-%m-%dT%H:%M:%S.%NZ > ubuntu-pilot-evidence/restore-start.txt
      - name: Restore only selected A compiler objects (no fallback)
        id: restore
        if: env.PILOT_MODE == 'cached-b'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.PILOT_SEED_CACHE_KEY }}
          enableCrossOsArchive: false
      - name: Retain actual restore outcome and end
        if: always() && env.PILOT_MODE == 'cached-b' && steps.restore.outcome != 'skipped'
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          date -u +%Y-%m-%dT%H:%M:%S.%NZ > ubuntu-pilot-evidence/restore-end.txt
          printf '%s\n' "$CACHE_HIT" > ubuntu-pilot-evidence/restore-hit.txt
          printf '%s\n' "$RESTORED_KEY" > ubuntu-pilot-evidence/restore-key.txt
      - name: Build actual four owning targets and SDK headers j2
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" build
      - name: Inventory actual cases and bind seven new FLOAT cases
        id: inventory
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" inventory
      - name: Run actual four GoogleTest suites and six architecture checks
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" test
      - name: Preserve statistics, phase exits and original logs
        if: always() && steps.configure.outcome == 'success'
        env:
          PILOT_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          PILOT_RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" finish
      - name: Save only exact source A objects for this workflow/run/attempt
        if: env.PILOT_MODE == 'seed-a'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.configure.outputs.cache_key }}
      - name: Bound text evidence after success or original failure
        id: package
        if: always()
        run: python3 "$PILOT_WORKFLOW_ROOT/tools/ci/ubuntu_development_pilot.py" package
      - name: Retain bounded source-only evidence, no executables or graph
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-real-change-${{ env.PILOT_MODE }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: product/ubuntu-pilot-evidence/
          retention-days: 3
          compression-level: 9
          if-no-files-found: error

  cold-b:
    name: Experimental real-change cold B - NOT full acceptance
    if: inputs.mode == 'real_change'
    needs: seed-a
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: *real_defaults
    outputs: *real_outputs
    env:
      PILOT_MODE: cold-b
      PILOT_EXPECTED_HEAD: ${{ inputs.changed_head }}
      PILOT_WORKFLOW_HEAD: ${{ inputs.expected_head }}
      PILOT_WORKFLOW_ROOT: ${{ github.workspace }}/pilot-workflow
      PILOT_SEED_HEAD: ${{ inputs.seed_head }}
      PILOT_CHANGED_HEAD: ${{ inputs.changed_head }}
      PILOT_SEED_CACHE_KEY: ${{ needs.seed-a.outputs.cache_key }}
      PILOT_SEED_COMPATIBILITY: ${{ needs.seed-a.outputs.compatibility_digest }}
      PILOT_SEED_INVENTORY: ${{ needs.seed-a.outputs.inventory_json }}
      PILOT_COLD_BINARY_DIGEST: ""
      PILOT_COLD_INVENTORY_DIGEST: ""
    steps: *real_steps

  cached-b:
    name: Experimental real-change cached B - NOT full acceptance
    if: inputs.mode == 'real_change'
    needs: [seed-a, cold-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: *real_defaults
    env:
      PILOT_MODE: cached-b
      PILOT_EXPECTED_HEAD: ${{ inputs.changed_head }}
      PILOT_WORKFLOW_HEAD: ${{ inputs.expected_head }}
      PILOT_WORKFLOW_ROOT: ${{ github.workspace }}/pilot-workflow
      PILOT_SEED_HEAD: ${{ inputs.seed_head }}
      PILOT_CHANGED_HEAD: ${{ inputs.changed_head }}
      PILOT_SEED_CACHE_KEY: ${{ needs.seed-a.outputs.cache_key }}
      PILOT_SEED_COMPATIBILITY: ${{ needs.seed-a.outputs.compatibility_digest }}
      PILOT_SEED_INVENTORY: ${{ needs.seed-a.outputs.inventory_json }}
      PILOT_COLD_BINARY_DIGEST: ${{ needs.cold-b.outputs.binary_digest }}
      PILOT_COLD_INVENTORY_DIGEST: ${{ needs.cold-b.outputs.inventory_digest }}
    steps: *real_steps
